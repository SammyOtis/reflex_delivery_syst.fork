<!doctype html>
<html lang="en">
  <head>
    <!-- =========================================
         BASIC DOCUMENT CONFIGURATION
    ========================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#0f172a"
    />

    <meta
      name="color-scheme"
      content="light dark"
    />

    <!-- =========================================
         PAGE INFORMATION
    ========================================== -->

    <title>Frontend Application</title>

    <meta
      name="description"
      content="A modern, responsive web application built with React and Vite."
    />

    <meta
      name="keywords"
      content="React, Vite, Web Application, Frontend, JavaScript"
    />

    <meta
      name="author"
      content="Your Name"
    />

    <!-- =========================================
         ROBOTS & SEARCH ENGINE SETTINGS
    ========================================== -->

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <!-- =========================================
         FAVICON
    ========================================== -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.svg"
    />

    <!-- =========================================
         PERFORMANCE
    ========================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- =========================================
         OPEN GRAPH / SOCIAL MEDIA
    ========================================== -->

    <meta
      property="og:title"
      content="Frontend Application"
    />

    <meta
      property="og:description"
      content="A modern and responsive web application built with React."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="Frontend Application"
    />

    <!-- =========================================
         TWITTER / X CARD
    ========================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Frontend Application"
    />

    <meta
      name="twitter:description"
      content="A modern web application built with React."
    />

    <meta
      name="twitter:image"
      content="/og-image.png"
    />

    <!-- =========================================
         MOBILE / PWA SUPPORT
    ========================================== -->

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Frontend App"
    />

    <!-- =========================================
         SECURITY / REFERRER
    ========================================== -->

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

  </head>

  <body>

    <!-- =========================================
         APPLICATION ROOT
    ========================================== -->

    <div id="root"></div>

    <!-- =========================================
         REACT APPLICATION
    ========================================== -->

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
